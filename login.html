<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - New Life RP</title><link rel="stylesheet" href="style.css"></head>
<body class="login-page">
<div class="login-container">
  <img src="assets/logo.png" class="logo"><h2>تسجيل الدخول</h2>
  <form id="loginForm">
    <input id="username" placeholder="اسم المستخدم" required>
    <input id="password" type="password" placeholder="كلمة المرور" required>
    <button type="submit" class="btn primary">دخول</button>
  </form>
  <p>ما عندك حساب؟ <a href="register.html">انشئ حساب</a></p>
  <div id="msg"></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  try{
    const res = await fetch('api/login.php', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u,password:p})});
    const j = await res.json();
    if(j.success){ localStorage.setItem('nlrp_token', j.token); location.href='dashboard.html'; }
    else document.getElementById('msg').innerText = j.message || 'خطأ';
  }catch(err){ document.getElementById('msg').innerText = 'خطأ اتصال'; }
});
</script>
</body></html>
